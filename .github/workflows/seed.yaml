# Build the Nix Seed and push it to ghcr, then commit the digest.
#
# The seed is a squashfs (Linux) or disk image (macOS) of this flake's
# build closure. Seed Build mounts it as /nix/store and builds against it
# with no substituters and nothing to fetch.
#
# Seeding is the slow half and only needs redoing when the closure
# changes -- a dependency bump, a toolchain change -- not on every
# commit, which is why this watches the files that decide the closure
# rather than running on every push.
name: Seed

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - flake.nix
      - flake.lock
      - default.nix
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/seed.yaml

jobs:
  seed:
    name: Build Seed
    runs-on: ${{ matrix.os }}
    strategy:
      # one platform failing should not hide the other's result
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      # the digest is committed back to .seed.lock
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Build and push seed
        uses: roundtablelove/nix-seed/seed@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Seeding is the one place a binary cache still earns its
          # keep: it builds the closure that consumers then get offline.
          # These are the values flake.nix already declares in nixConfig,
          # which Nix ignores unless the user is trusted -- so pass them
          # explicitly. Without helix's cache, a handful of crates that
          # cache.nixos.org has never built (gix-date, gix-diff, ...)
          # fall through to crates.io, which answers 403 from CI.
          nix_conf: |
            extra-substituters = https://helix.cachix.org
            extra-trusted-public-keys = helix.cachix.org-1:ejp9KQpR1FBI2onstMQ34yogDm4OgU2ru6lIwPvuCVs=
